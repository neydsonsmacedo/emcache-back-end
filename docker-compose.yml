services:
  postgres:
    image: postgres:16-alpine
    container_name: emcache_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emcache}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-emcache}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emcache_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emcache}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_WEBHOOK_URL: ${PLUGGY_WEBHOOK_URL:-}
      PLUGGY_INCLUDE_SANDBOX: ${PLUGGY_INCLUDE_SANDBOX:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
