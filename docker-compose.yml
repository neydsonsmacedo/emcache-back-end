services:
  postgres:
    image: postgres:16-alpine
    container_name: emcache_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emcache}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-emcache}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emcache_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emcache}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
      PLUGGY_WEBHOOK_URL: ${PLUGGY_WEBHOOK_URL:-}
      PLUGGY_INCLUDE_SANDBOX: ${PLUGGY_INCLUDE_SANDBOX:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-1}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openai}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-https://api.openai.com/v1}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_VISION_MODEL: ${LLM_FALLBACK_VISION_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_TRANSCRIPTION_MODEL: ${LLM_FALLBACK_TRANSCRIPTION_MODEL:-whisper-1}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_KEYS_ENCRYPTION_KEY: ${LLM_KEYS_ENCRYPTION_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      ELEVENLABS_TRANSCRIPTION_MODEL: ${ELEVENLABS_TRANSCRIPTION_MODEL:-scribe_v1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
